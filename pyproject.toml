[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flatsat-controller"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML", "hitl-bridge>=0.1.0"]

[project.scripts]
flatsat = "flatsat_controller.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["flatsat_controller*", "experiments*"]
