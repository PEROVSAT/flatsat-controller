# Connect to a running hitl-bridge. Device 1 is the MPU6050 emulator, not the OBC.
simulation_link:
  host: 127.0.0.1
  port: 4242
  controller_address: 253
  device_address: 1
  connect_timeout_s: 3
  io_timeout_s: 0.5

experiment:
  accel_range_g: 2
  gyro_range_dps: 250
  timeout_s: 10
  sample_a:
    sequence: 101
    accel_m_s2: [0.0, 0.0, 9.80665]
    gyro_rad_s: [0.0, 0.0, 0.0]
    temperature_c: 25.0
  sample_b:
    sequence: 102
    accel_m_s2: [1.0, -1.0, 9.80665]
    gyro_rad_s: [0.1, -0.2, 0.3]
    temperature_c: 30.0
