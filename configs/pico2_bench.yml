# Example named pipelines. Paths are relative to this file.
openocd: ~/.local/bin/openocd

builds:
  emulator:
    app_root: ../../emulated-devices/mpu6050
    board: rpi_pico2/rp2350a/m33
    kind: build
    west: ../../.venv/bin/west
  flight:
    app_root: ../../../perovsat-workspace/perovsat-app
    board: rpi_pico2/rp2350a/m33
    kind: dbuild
    west: ../../../perovsat-workspace/.venv/bin/west

targets:
  imu0:
    board: rpi_pico2/rp2350a/m33
    probe_serial: "E665485457168830"
  obc:
    board: rpi_pico2/rp2350a/m33
    probe_serial: "REPLACE_WITH_OBC_PROBE_SERIAL"

# Optional Bridge connection for programmatic simulation observation:
# simulation_link:
#   host: 127.0.0.1
#   port: 4242
